[project]
name = "kk_robotics"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.3.3",
]
[tool.ruff]
line-length = 100

[tool.ruff.lint.isort]
force-single-line = true

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "ruff>=0.13.3",
    "ty>=0.0.1a25",
]

[project.scripts]
simulator = "kk_robotics.simulator.main:main"
vizualizer = "kk_robotics.vizualizer.main:main"
planner = "kk_robotics.navigation.planner.main:main"
costmap = "kk_robotics.navigation.costmap.main:main"

[tool.setuptools.packages.find]
where = [""]

[tool.uv]
package=true
